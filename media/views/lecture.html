<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			body {
				background-color: #2196F3;
				color: white;
				padding: 20px;
				text-align: center;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}
			.icon { margin: 10px auto; }
			.status-badge {
				display: inline-block;
				background: rgba(255,255,255,0.2);
				padding: 5px 15px;
				border-radius: 20px;
				margin: 10px 0;
				font-weight: bold;
			}
			.feature-list {
				text-align: left;
				margin: 20px auto;
				max-width: 250px;
			}
			.feature-item {
				display: flex;
				align-items: center;
				margin: 8px 0;
				font-size: 13px;
			}
			.feature-icon {
				margin-right: 10px;
				width: 20px;
				text-align: center;
			}
			h1 { margin: 10px 0; }
			h2 { margin: 5px 0; font-weight: normal; opacity: 0.9; }
		</style>
	</head>
	<body>
		<div class="icon">
			<svg width="64" height="64" viewBox="0 0 24 24" fill="white">
				<path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
			</svg>
		</div>
		<h1>LECTURE MODE</h1>
		<div class="status-badge">INACTIVE</div>
		<h2>AI Extension Blocking Disabled</h2>

		<div class="feature-list">
			<div class="feature-item">
				<span class="feature-icon">&#9989;</span>
				<span>AI extensions are allowed</span>
			</div>
			<div class="feature-item">
				<span class="feature-icon">&#128218;</span>
				<span>Learning mode active</span>
			</div>
			<div class="feature-item">
				<span class="feature-icon">&#128275;</span>
				<span>No restrictions applied</span>
			</div>
			<div class="feature-item">
				<span class="feature-icon">&#128161;</span>
				<span>Use AI tools freely</span>
			</div>
		</div>
	</body>
</html>
